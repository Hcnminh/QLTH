  /api/v1/timetable/slots:
    post:
      tags: [curriculum]
      summary: Cấu hình tiết thời khóa biểu và kiểm soát không trùng lịch
      description: |
        Cấu hình tiết thời khóa biểu:
        - Đảm bảo **không trùng lịch giảng dạy của giáo viên** giữa các lớp khác nhau tại cùng thứ/tiết theo **Thông tư 05/2025/TT-BGDĐT**.
        - Đảm bảo một lớp không bị xếp 2 môn học đồng thời.
        - Đảm bảo một phòng chức năng không bị trùng lịch sử dụng.
        - Trả về `409 Conflict` nếu phát hiện xung đột lịch.
        
        Role được phép: `BGH`, `TO_TRUONG`, `GVCN`, `GVBM`, `SUPER_ADMIN`.
      operationId: configureTimetableSlot
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableSlotConfigureRequest'
            example:
              academic_year_id: '2026-2027'
              term_id: '2026-2027-HK1'
              class_id: f0000000-0000-0000-0000-000000000002
              class_name: '5A1'
              teacher_id: b0000000-0000-0000-0000-000000000001
              teacher_name: 'Nguyễn Văn An'
              subject_id: TOAN
              day_of_week: 3
              period: 1
              room_number: 'Phòng 5A1'
              week_number: 0
      responses:
        '201':
          description: Cấu hình tiết thời khóa biểu thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TimetableSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Phát hiện xung đột thời khóa biểu vi phạm Thông tư 05/2025/TT-BGDĐT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags: [curriculum]
      summary: Lấy danh sách các tiết thời khóa biểu
      description: Truy vấn lịch thời khóa biểu theo năm học, học kỳ, lớp học hoặc giáo viên.
      operationId: getTimetableSlots
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
        - name: academic_year_id
          in: query
          required: false
          schema: { type: string }
          example: '2026-2027'
        - name: term_id
          in: query
          required: false
          schema: { type: string }
          example: '2026-2027-HK1'
        - name: class_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: teacher_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Lấy danh sách thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TimetableSlot'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

