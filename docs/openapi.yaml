  /api/v1/students/onboard:
    post:
      tags: [students]
      summary: Tiếp nhận hồ sơ học sinh (tuyển sinh đầu cấp)
      description: |
        Tiếp nhận học sinh mới, đối soát số định danh cá nhân (VNeID / Luật Căn cước 2023).

        **Ràng buộc pháp lý bắt buộc** theo Điều 20 Nghị định 13/2023/NĐ-CP:
        `has_digital_consent` phải là `true` — tức đã thu được sự đồng ý của cha mẹ/người giám hộ.
        Nếu thiếu, API trả **422 Unprocessable Entity** và không tạo hồ sơ.

        Role được phép: `BGH`, `VAN_THU`, `SUPER_ADMIN`.
      operationId: onboardStudent
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentIntake'
      responses:
        '201':
          description: Tiếp nhận thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentIntake'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Thiếu sự đồng thuận số của cha mẹ/người giám hộ (NĐ 13/2023 Điều 20)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                code: 422
                message: Chưa có sự đồng thuận số (Digital Consent) của cha mẹ/người giám hộ theo Điều 20 Nghị định 13/2023/NĐ-CP

  /api/v1/lesson-plans/submit:
    post:
      tags: [curriculum]
      summary: Nộp kế hoạch bài dạy (CV 2345 / STEM TT 86)
      description: |
        Nộp kế hoạch bài dạy điện tử (giáo án) tuân thủ:
        - **Công văn 2345/BGDĐT-GDTH** (4 bước hoạt động: Khởi động, Khám phá, Luyện tập, Vận dụng; 3 mục tiêu: Kiến thức, Năng lực, Phẩm chất).
        - **Thông tư 86/BGDĐT & CV 909/BGDĐT-GDTH** (giáo dục STEM tiểu học).
        - Giới hạn từ tuần 1 đến tuần 35 theo Thông tư 05/2025/TT-BGDĐT.
        - Khởi tạo trạng thái `SUBMITTED` (hoặc `DRAFT` nếu bật cờ lưu nháp).
        
        Role được phép: `BGH`, `TO_TRUONG`, `GVCN`, `GVBM`, `GV`, `SUPER_ADMIN`.
      operationId: submitLessonPlan
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonPlanSubmitRequest'
            example:
              teacher_id: b0000000-0000-0000-0000-000000000001
              grade_level: 5
              subject_id: TOAN
              title: 'Bài 15: Thể tích hình lập phương'
              week_number: 15
              duration_slots: 2
              curriculum_standard: CV_2345
              objectives:
                knowledge: Nắm công thức tính thể tích hình lập phương V = a x a x a
                competencies: Năng lực mô hình hóa toán học
                qualities: Chăm chỉ, kiên trì
              equipment: Mô hình lập phương đơn vị 1cm3
              activities:
                - phase: Khởi động
                  duration_mins: 5
                  content: Trò chơi ghép khối rubik
                - phase: Khám phá
                  duration_mins: 15
                  content: Xây dựng công thức tính thể tích
                - phase: Luyện tập
                  duration_mins: 15
                  content: Bài tập 1 và 2 SGK trang 120
                - phase: Vận dụng
                  duration_mins: 5
                  content: Tính thể tích hộp quà lưu niệm
      responses:
        '201':
          description: Nộp kế hoạch bài dạy thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LessonPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/lesson-plans/{id}/approve:
    post:
      tags: [curriculum]
      summary: Phê duyệt hoặc góp ý kế hoạch bài dạy phân tầng
      description: |
        Quy trình thẩm định phân tầng:
        - **Tổ trưởng chuyên môn (TO_TRUONG)**: Duyệt bước 1 chuyển trạng thái sang `DEPARTMENT_HEAD_APPROVED`.
        - **Ban Giám hiệu (BGH)**: Duyệt hoàn tất chuyển trạng thái sang `APPROVED` kèm chữ ký số SmartCA/TSA.
        - Khi từ chối (`REJECT`) hoặc yêu cầu sửa (`REQUEST_REVISION`): bắt buộc nhập `comments` góp ý sư phạm.
        
        Role được phép: `BGH`, `TO_TRUONG`, `SUPER_ADMIN`.
      operationId: approveLessonPlan
      parameters:
        - name: id
          in: path
          required: true
          description: UUID của kế hoạch bài dạy
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonPlanApproveRequest'
            example:
              action: APPROVE
              reviewer_role: TO_TRUONG
              reviewer_name: Trần Thị Bình
              comments: Giáo án đúng chuẩn CV 2345, tiến trình sư phạm hợp lý. Duyệt chuyển BGH ký số.
              digital_signature: SIGN_SMARTCA_TOTRUONG_2026
      responses:
        '200':
          description: Phê duyệt hoặc góp ý kế hoạch bài dạy thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LessonPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy kế hoạch bài dạy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

