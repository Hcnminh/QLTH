  /api/v1/students/{id}/health/prescriptions:
    post:
      tags: [health]
      summary: Phụ huynh gửi yêu cầu cấp phát thuốc tại trường
      description: |
        Gửi thông tin thuốc cần uống, liều lượng và thời gian cho học sinh.
        
        Role được phép: `BGH`, `GVCN`, `PHHS`, `Y_TE`, `NHAN_VIEN_Y_TE`, `SUPER_ADMIN`.
      operationId: addPrescriptionDelivery
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medication_name, dosage, administration_time]
              properties:
                medication_name:
                  type: string
                dosage:
                  type: string
                administration_time:
                  type: string
                instructions:
                  type: string
                parent_notes:
                  type: string
      responses:
        '201':
          description: Gửi yêu cầu đơn thuốc thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/students/{id}/health/prescriptions/{rx_id}/administer:
    post:
      tags: [health]
      summary: Nhân viên y tế xác nhận cho uống thuốc
      description: |
        Xác nhận thời điểm và nhân viên thực hiện cấp phát thuốc cho học sinh.
        
        Role được phép: `BGH`, `Y_TE`, `NHAN_VIEN_Y_TE`, `SUPER_ADMIN`.
      operationId: administerPrescription
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rx_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nurse_name]
              properties:
                nurse_name:
                  type: string
      responses:
        '200':
          description: Đã xác nhận cấp phát thuốc
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/students/{id}/health/medical-events:
    post:
      tags: [health]
      summary: Ghi nhận sự kiện y tế hoặc sơ cấp cứu tại trường
      description: |
        Lưu nhật ký sơ cấp cứu, xử lý sốt/tai nạn nhỏ tại phòng y tế học đường.
        
        Role được phép: `BGH`, `Y_TE`, `NHAN_VIEN_Y_TE`, `SUPER_ADMIN`.
      operationId: addMedicalEvent
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, treatment]
              properties:
                event_type:
                  type: string
                symptoms:
                  type: string
                treatment:
                  type: string
                medication_given:
                  type: string
                nurse_name:
                  type: string
                parent_notified:
                  type: boolean
      responses:
        '201':
          description: Ghi nhận sự kiện y tế thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integrations/smartca/sign:
    post:
      tags: [integrations]
      summary: Ký số điện tử SmartCA và cấp dấu thời gian TSA
      description: |
        Ký số tập trung qua nhà cung cấp SmartCA trên môi trường Sandbox Stub,
        trả về chữ ký mô phỏng chuẩn CMS/PKCS#7 và dấu thời gian TSA (RFC 3161).
        Tuân thủ Luật Giao dịch điện tử 2023 và Thông tư 03/2018/TT-BGDĐT.
      operationId: signSmartCA
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, signer_id, signer_name, signer_role]
              properties:
                document_id:
                  type: string
                  format: uuid
                document_type:
                  type: string
                  example: TRANSCRIPT_SNAPSHOT
                document_hash:
                  type: string
                signer_id:
                  type: string
                  format: uuid
                signer_name:
                  type: string
                signer_role:
                  type: string
                  example: GVCN
      responses:
        '200':
          description: Ký số SmartCA thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integrations/vietqr/generate:
    post:
      tags: [integrations]
      summary: Sinh mã VietQR động chuẩn EMVCo và URL ảnh
      description: |
        Sinh mã VietQR động chuẩn EMVCo thanh toán tiền ăn, học phí bán trú
        theo Quyết định 1927/QĐ-NHNN và NAPAS 247.
      operationId: generateVietQR
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_bin, account_number, amount, description]
              properties:
                bank_bin:
                  type: string
                  example: "970422"
                account_number:
                  type: string
                  example: "0123456789"
                account_name:
                  type: string
                  example: "Truong Tieu Hoc EduPrimary"
                amount:
                  type: number
                  example: 550000
                description:
                  type: string
                  example: "TIEN AN BAN TRU THANG 11"
      responses:
        '200':
          description: Sinh mã VietQR thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integrations/moet/sync:
    post:
      tags: [integrations]
      summary: Đồng bộ hàng đợi Outbox lên CSDL Ngành Giáo dục MOET
      description: |
        Xử lý hàng đợi Outbox đồng bộ hồ sơ học sinh và học bạ số lên
        CSDL ngành Giáo dục và Đào tạo theo Thông tư 42/2021/TT-BGDĐT.
      operationId: syncMOET
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_year, sync_type]
              properties:
                school_id:
                  type: string
                  format: uuid
                academic_year:
                  type: string
                  example: "2026-2027"
                sync_type:
                  type: string
                  example: "ALL"
                batch_size:
                  type: integer
                  example: 50
      responses:
        '200':
          description: Đồng bộ hàng đợi MOET thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integrations/moet/queue:
    get:
      tags: [integrations]
      summary: Kiểm tra trạng thái hàng đợi Outbox MOET
      description: Lấy số lượng bản ghi học sinh và học bạ số đang chờ đồng bộ lên MOET CSDL.
      operationId: getMOETQueue
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
        - name: school_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Trạng thái hàng đợi
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integrations/vneid/verify:
    post:
      tags: [integrations]
      summary: Xác thực định danh điện tử VNeID Mức 2
      description: |
        Xác thực thông tin định danh công dân mức độ 2 kết nối C06 Bộ Công an
        theo Nghị định 69/2024/NĐ-CP và kiểm tra Digital Consent Nghị định 13/2023/NĐ-CP.
      operationId: verifyVNeID
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [national_id, full_name, consent_granted]
              properties:
                national_id:
                  type: string
                  example: "001202012345"
                full_name:
                  type: string
                  example: "Nguyễn Văn An"
                date_of_birth:
                  type: string
                  example: "2018-05-15"
                gender:
                  type: string
                  example: "MALE"
                consent_granted:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Xác thực VNeID Mức 2 thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Chưa có sự đồng thuận số theo NĐ 13/2023

  /api/v1/integrations/einvoice/issue:
    post:
      tags: [integrations]
      summary: Phát hành hóa đơn điện tử Nghị định 123/2020/NĐ-CP
      description: |
        Phát hành hóa đơn điện tử học phí, tiền ăn bán trú có mã cơ quan thuế
        tuân thủ Nghị định 123/2020/NĐ-CP và Thông tư 78/2021/TT-BTC.
      operationId: issueEInvoice
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer_name, items]
              properties:
                school_id:
                  type: string
                  format: uuid
                buyer_name:
                  type: string
                  example: "Trần Văn Hùng"
                buyer_tax_code:
                  type: string
                student_name:
                  type: string
                  example: "Trần Bảo Nam"
                student_class:
                  type: string
                  example: "5A1"
                items:
                  type: array
                  items:
                    type: object
                    required: [name, quantity, unit_price]
                    properties:
                      name:
                        type: string
                      unit:
                        type: string
                      quantity:
                        type: number
                      unit_price:
                        type: number
                      vat_rate:
                        type: number
      responses:
        '200':
          description: Phát hành hóa đơn điện tử thành công
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/integrations/sandbox/status:
    get:
      tags: [integrations]
      summary: Trạng thái các cổng tích hợp Sandbox Stubs
      description: Trả về trạng thái hoạt động và đặc tả kỹ thuật của toàn bộ 5 hệ thống sandbox ngoại vi.
      operationId: getSandboxStatus
      parameters:
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/UserRole'
      responses:
        '200':
          description: Danh sách trạng thái 5 cổng sandbox stubs
        '401':
          $ref: '#/components/responses/MissingSchoolId'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  parameters:
    SchoolId:
      name: X-School-ID
      in: header
      required: true
      description: UUID của trường (multi-tenancy). Thiếu header này trả 401.
      schema:
        type: string
        format: uuid
    UserRole:
      name: X-User-Role
      in: header
      required: true
      description: Vai trò người gọi. `SUPER_ADMIN` bypass mọi kiểm tra role.
      schema:
        type: string
        enum: [BGH, TO_TRUONG, GVCN, GVBM, KE_TOAN, VAN_THU, PHHS, Y_TE, NHAN_VIEN_Y_TE, BEP_TRUONG, SUPER_ADMIN]

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 400
            message: 'Dữ liệu đầu vào không hợp lệ: Key: ''...'' Error:Field validation for ''...'' failed on the ''required'' tag'
    MissingSchoolId:
      description: Thiếu header X-School-ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 401
            message: Thiếu mã định danh trường học (X-School-ID)
    Forbidden:
      description: Role không được phép truy cập endpoint này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            code: 403
            message: Không có quyền thực hiện thao tác này

  schemas:
    ApiEnvelope:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: integer
        message:
          type: string

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
        message:
          type: string

    TeacherWorkloadProfile:
      type: object
      description: Thông số làm việc của giáo viên trong một năm học (Thông tư 05/2025/TT-BGDĐT)
      required: [teacher_id, teacher_name]
      properties:
        teacher_id:
          type: string
          example: GV001
        teacher_name:
          type: string
          example: Lê Thị Mai
        school_type:
          type: string
          description: Loại trường quyết định định mức chuẩn
          enum: [PRIMARY, ETHNIC_BOARDING_PRIMARY, SPECIAL_EDUCATION]
          default: PRIMARY
        is_homeroom:
          type: boolean
          description: Giáo viên chủ nhiệm — giảm 4 tiết/tuần (tiểu học)
        is_head_subject:
          type: boolean
          description: Tổ trưởng chuyên môn — giảm 3 tiết/tuần
        is_deputy_head_subject:
          type: boolean
          description: Tổ phó chuyên môn — giảm 1 tiết/tuần
        has_young_child:
          type: boolean
          description: Nữ giáo viên nuôi con dưới 12 tháng — giảm 3 tiết/tuần
        counseling_hours_week:
          type: integer
          minimum: 0
          maximum: 8
          description: Số tiết kiêm nhiệm tư vấn tâm lý học sinh mỗi tuần
        inclusive_teaching_wk:
          type: integer
          description: Số tiết dạy hòa nhập trẻ khuyết tật mỗi tuần (quy đổi hệ số 0.2)
        pre_grade1_ethnic_hours:
          type: integer
          description: Số tiết dạy tiếng Việt cho trẻ DTTS trước lớp 1 trong hè (hệ số 1.5)
        actual_taught_hours:
          type: integer
          description: Tổng số tiết thực tế đã giảng dạy cả năm
          example: 720
        weeks_in_school_year:
          type: integer
          description: Số tuần thực dạy; mặc định 35 nếu ≤ 0
          default: 35
          example: 35

    WorkloadQuotaCalculationResult:
      type: object
      properties:
        standard_annual_hours:
          type: integer
          description: Định mức chuẩn cả năm (805 với tiểu học thường)
          example: 805
        weekly_reduced_hours:
          type: integer
          description: Tổng số tiết giảm mỗi tuần
          example: 4
        annual_reduced_hours:
          type: integer
          description: Tổng số tiết giảm cả năm
          example: 140
        net_annual_quota:
          type: integer
          description: Định mức thực phải dạy cả năm
          example: 665
        inclusive_bonus_hours:
          type: number
          format: float
          description: Số tiết quy đổi từ dạy hòa nhập
        total_effective_hours:
          type: number
          format: float
          description: Tổng số tiết quy đổi đã thực hiện
          example: 720
        overtime_hours:
          type: number
          format: float
          description: Số tiết vượt định mức (thừa giờ) để thanh toán
          example: 55

    KpiCriterion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: KPI-GV-01
        title:
          type: string
        weight:
          type: number
          format: float
          example: 0.2
        max_score:
          type: number
          format: float
          example: 100
        source_type:
          type: string
          enum: [SYSTEM_AUTOMATED, MANAGER_REVIEW, PEER_REVIEW, PARENT_CSAT]
        actual_score:
          type: number
          format: float

    StaffKPISubmission:
      type: object
      description: Dữ liệu đánh giá KPI 360 độ của một cán bộ/giáo viên
      required: [staff_id, automated_system_score, manager_assessment_score, peer_review_score, parent_satisfaction_score]
      properties:
        staff_id:
          type: string
          format: uuid
        staff_name:
          type: string
          example: Lê Văn Cường
        job_position:
          type: string
          description: Vị trí việc làm theo Thông tư 20/2023/TT-BGDĐT
          example: HOMEROOM_TEACHER
        automated_system_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Điểm hệ thống đo tự động — trọng số 40%
          example: 92
        manager_assessment_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Điểm BGH/khối trưởng chấm — trọng số 30%
          example: 90
        peer_review_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Điểm đồng nghiệp đánh giá chéo — trọng số 15%
          example: 90
        parent_satisfaction_score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Điểm khảo sát phụ huynh (CSAT) — trọng số 15%
          example: 90
        criteria_details:
          type: array
          items:
            $ref: '#/components/schemas/KpiCriterion'
        has_disciplinary_action:
          type: boolean
          description: Bị kỷ luật Đảng/chính quyền trong năm (NĐ 48/2023) — điểm liệt
        violated_tutoring_rules:
          type: boolean
          description: Vi phạm quy định cấm dạy thêm tiểu học (TT 29/2024, TT 19/2026) — điểm liệt
        has_severe_safety_incident:
          type: boolean
          description: Để xảy ra tai nạn thương tích / mất ATTP nghiêm trọng — điểm liệt
        has_innovative_solution:
          type: boolean
          description: Có sáng kiến hoặc giải pháp đổi mới sáng tạo được công nhận (Luật TĐKT 2022)

    FinalKPIEvaluation:
      type: object
      properties:
        staff_id:
          type: string
          format: uuid
        staff_name:
          type: string
        final_score:
          type: number
          format: float
          description: Điểm tổng hợp có trọng số, thang 100
        official_rank:
          type: string
          description: Mức xếp loại viên chức
          enum:
            - HOÀN THÀNH XUẤT SẮC NHIỆM VỤ
            - HOÀN THÀNH TỐT NHIỆM VỤ
            - HOÀN THÀNH NHIỆM VỤ
            - KHÔNG HOÀN THÀNH NHIỆM VỤ
        reason:
          type: string
          description: Căn cứ xếp loại (ghi rõ khi bị điểm liệt hoặc bị hạ do trần 20%)
        calculated_at:
          type: string
          format: date-time

    StudentIntake:
      type: object
      description: Hồ sơ tiếp nhận học sinh. Dữ liệu trẻ em dưới 14 tuổi — chịu sự điều chỉnh của NĐ 13/2023/NĐ-CP.
      required: [student_code, full_name, birth_date, guardian_name, guardian_phone, has_digital_consent]
      properties:
        id:
          type: string
          format: uuid
          description: Server tự sinh nếu bỏ trống
        school_id:
          type: string
          format: uuid
        national_id:
          type: string
          maxLength: 12
          description: Số định danh cá nhân 12 số (Luật Căn cước 2023). KHÔNG ghi vào log.
          example: '001206012345'
        student_code:
          type: string
          example: HS1001
        full_name:
          type: string
          example: Nguyễn Hoàng
        birth_date:
          type: string
          format: date-time
        gender:
          type: string
          enum: [MALE, FEMALE]
        ethnicity:
          type: string
          example: Kinh
