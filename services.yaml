commands:
  install: bash -lc 'cd /Users/dkm/dev/QLTH && go mod download'
  build: bash -lc 'cd /Users/dkm/dev/QLTH && go build -v -o bin/api ./cmd/api'
  test: bash -lc 'cd /Users/dkm/dev/QLTH && go test -v -count=1 ./...'
  typecheck: bash -lc 'cd /Users/dkm/dev/QLTH && go vet ./...'
  lint: bash -lc 'cd /Users/dkm/dev/QLTH && make lint'
  qa: bash -lc 'cd /Users/dkm/dev/QLTH && ./scripts/qa_e2e.sh'

services:
  api:
    start: bash -lc 'cd /Users/dkm/dev/QLTH && PORT=8098 go run ./cmd/api'
    stop: bash -lc 'lsof -ti :8098 | xargs kill -9 2>/dev/null || true'
    healthcheck: curl -sf http://localhost:8098/health
    port: 8098
    depends_on: []
