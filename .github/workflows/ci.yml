name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Vet & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Các file chưa format đúng gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1 | tee coverage-summary.txt
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Tổng coverage: ${total}%"
          threshold=70
          if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
            echo "Coverage ${total}% dưới ngưỡng bắt buộc ${threshold}%"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt
          retention-days: 30

  docs:
    name: Validate docs & AGENTS.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate OpenAPI spec (structure, $ref, router coverage)
        run: python3 scripts/validate_openapi.py

      - name: Validate AGENTS.md consistency (make targets, file paths, packages)
        run: python3 scripts/validate_agents_md.py

      - name: Check generated API reference is up to date
        run: python3 scripts/generate_api_docs.py --check

  build:
    name: Build binary & Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p bin
          go build -v -o bin/api ./cmd/api

      - name: Smoke test binary
        run: |
          PORT=8099 ./bin/api &
          sleep 2
          curl -sf http://localhost:8099/health | grep -q '"status":"healthy"'
          kill %1

      - name: Build Docker image
        run: docker build -t qlth-api:${{ github.sha }} .
